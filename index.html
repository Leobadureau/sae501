
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAE501 - Mountain Clearing</title>

    <link rel="stylesheet" href="./css/styles.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
        }
      }
    </script>
  </head>

  <body>

    <div class="hud" aria-live="polite">

      <!-- ÉCRAN DE CHOIX DU MODE -->
      <div id="mode-overlay" class="mode-overlay">

        <div class="mode-content">

          <h1>Les légendes corses</h1>

          <p>
            Choisissez votre mode d'expérience.
          </p>

          <div class="mode-buttons">

            <button id="pc-mode" class="mode-button" type="button">
              <span>Version PC</span>
              <small>Découvrir l'expérience sur ordinateur</small>
            </button>

            <button id="ar-mode" class="mode-button" type="button">
              <span>Version réalité augmentée</span>
              <small>Scanner la carte avec votre caméra</small>
            </button>

          </div>

        </div>

      </div>

      <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" aria-atomic="true" hidden>
        <div class="loading-card">
          <img
            class="loading-logo"
            src="./assets/images/loading-logo.svg"
            alt="Emblème provisoire des légendes corses"
          />
          <div class="loading-tiles" aria-hidden="true">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <p id="loading-message" class="loading-message">Préparation du monde…</p>
          <p class="loading-hint">Laissez-vous transporter dans l’au-delà…</p>
        </div>
      </div>

      <!-- BOUTON D'ENTRÉE EN AR -->
      <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" hidden>
        Couper la musique
      </button>

      <button id="vr-button" class="xr-button" type="button" hidden>
        Entrer en AR
      </button>

      <!-- INFORMATIONS XR -->
      <p id="xr-status" class="xr-status" role="status" hidden></p>

      <output id="position-readout" class="position-readout" aria-live="polite" hidden></output>

      <div id="reveal-flash" class="reveal-flash" aria-hidden="true"></div>

      <!-- MESSAGE DE DÉTECTION DU MARQUEUR -->
      <div id="marker-overlay" class="marker-overlay">
        Scannez le marqueur <strong>SCANNE.png</strong>
      </div>

    </div>

    <script type="module" src="./js/main.js?v=quiet-music-20261112"></script>

  </body>
</html>
