<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAE501 - Mountain Clearing</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm",
          "@sparkjsdev/spark": "./spark.module.min.js"
        }
      }
    </script>
  </head>

  <body>
    <div class="hud" aria-live="polite">
      <div id="motion-control" class="ui-panel" hidden>
        <button id="motion-button" class="motion-toggle" type="button">
          Activer le regard gyroscopique
        </button>
      </div>

      <p id="motion-status" class="status" role="status" hidden></p>

      <button id="vr-button" class="xr-button" type="button" hidden>
        Entrer en AR
      </button>

      <p id="xr-status" class="xr-status" role="status" hidden></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
