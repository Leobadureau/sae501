
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aldilà — Expérience narrative</title>

    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/experience.css" />
    <link rel="stylesheet" href="./css/home.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
        }
      }
    </script>
  </head>

  <body>

    <div class="hud" aria-live="polite">

      <!-- ÉCRAN DE CHOIX DU MODE -->
      <div id="mode-overlay" class="mode-overlay">
        <div class="scene-backdrop" aria-hidden="true"></div>
        <canvas id="mist-canvas" class="mist-canvas" aria-hidden="true"></canvas>
        <main class="mode-content" aria-labelledby="brand-title">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 321 170" role="presentation">
              <path d="M227 6c-6-3-10-4-16-5-11-1-31-2-40-1l-29 3c-2 0-7 3-8 5-4 12-4 24-2 36 2 11 9 20 21 21l60 8c4 1 10-1 10-5-1-6-9-10-14-10l-23 0c-7 0-17-5-15-10 1-1 4-3 5-3 21-1 55 4 69 18 8 8 11 18 13 28l5 25c0 2 3 6 5 6 3 0 7-4 7-8 0-21 0-42-14-57-9-8-19-14-30-18l-2-3c-1-1 5-4 15 1 19 10 35 21 38 42 2 14 2 27 2 42 0 3 2 6 5 6 2 0 6-2 6-5 3-22 2-45-6-67-4-9-8-16-18-22l-19-14c-3-2-6-3-11-7z" />
              <circle cx="109" cy="24" r="15" />
              <path d="M98 159c6 3 10 4 16 5 11 1 31 2 40 1l29-3c2 0 7-3 8-5 4-12 4-24 2-36-2-11-9-20-21-21l-60-8c-4-1-10 1-10 5 1 6 9 10 14 10l23 0c7 0 17 5 15 10-1 1-4 3-5 3-21 1-55-4-69-18-8-8-11-18-13-28l-5-25c0-2-3-6-5-6-3 0-7 4-7 8 0 21 0 42 14 57 9 8 19 14 30 18l2 3c1 1-5 4-15-1-19-10-35-21-38-42-2-14-2-27-2-42 0-3-2-6-5-6-2 0-6 2-6 5-3 22-2 45 6 67 4 9 8 16 18 22l19 14c3 2 6 3 11 7z" />
              <circle cx="217" cy="142" r="15" />
            </svg>
          </div>
          <h1 id="brand-title">ALDILÀ</h1>
          <span class="title-rule" aria-hidden="true"></span>
          <p class="tagline" data-copy="tagline">Entrez dans l’expérience narrative.</p>

          <div class="mode-buttons">
            <button id="pc-mode" class="mode-button" type="button" aria-label="Version ordinateur">
              <img class="mode-icon" src="./assets/images/computer-svgrepo-com.svg" alt="" aria-hidden="true" />
              <span>PC</span>
            </button>
            <button id="ar-mode" class="mode-button" type="button" aria-label="Version réalité virtuelle">
              <img class="mode-icon" src="./assets/images/vr-svgrepo-com.svg" alt="" aria-hidden="true" />
              <span>VR</span>
            </button>
          </div>

          <section class="language-picker" aria-label="Choix de la langue">
            <div class="language-heading"><span></span><p data-copy="language">LANGUE</p><span></span></div>
            <div class="language-options" role="group" aria-label="Langue">
              <button class="language-button is-active" type="button" data-language="fr" aria-pressed="true">FR</button>
              <button class="language-button" type="button" data-language="co" aria-pressed="false">CORSE</button>
            </div>
          </section>
        </main>
      </div>

      <div id="loading-overlay" class="loading-overlay" role="status" aria-live="polite" aria-atomic="true" hidden>
        <div class="loading-card">
          <img
            class="loading-logo"
            src="./assets/images/loading-logo.svg"
            alt="Emblème provisoire des légendes corses"
          />
          <div class="loading-tiles" aria-hidden="true">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <p id="loading-message" class="loading-message">Préparation du monde…</p>
          <p class="loading-hint">Laissez-vous transporter dans l’au-delà…</p>
        </div>
      </div>

      <!-- BOUTON D'ENTRÉE EN AR -->
      <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" hidden>
        Couper la musique
      </button>

      <button id="vr-button" class="xr-button" type="button" hidden>
        Entrer en AR
      </button>

      <button id="inventory-toggle" class="inventory-toggle" type="button" aria-expanded="false" aria-controls="inventory-panel" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h16l1 13H3l1-13Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M8 12v1m8-1v1"/></svg>
        <span>Inventaire</span><kbd>I</kbd>
      </button>

      <section id="inventory-panel" class="inventory-panel" aria-label="Inventaire" hidden>
        <header class="inventory-header">
          <div><span class="narrative-kicker">ALDILÀ · OBJETS</span><h2>Inventaire</h2></div>
          <button id="inventory-close" class="inventory-close" type="button" aria-label="Fermer l’inventaire">×</button>
        </header>
        <p id="inventory-bag-status" class="inventory-bag-status">Sacoche · au sol</p>
        <div class="inventory-items" role="group" aria-label="Objets disponibles">
          <button class="inventory-item" type="button" data-inventory-item="corsica-map" aria-disabled="true" disabled>
            <span class="inventory-item-icon inventory-map-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M18 3 25 7l-2 5 3 4-4 4-1 6-5 3-2-5-4-3 2-6-2-4 3-5Z"/><path d="m13 11 4 2-2 4 3 3"/></svg></span>
            <span><strong>Carte de Corse</strong><small>La mémoire de l’île</small></span>
            <span class="inventory-lock" aria-hidden="true">·</span>
          </button>
          <button class="inventory-item" type="button" data-inventory-item="rope" aria-disabled="true" disabled>
            <span class="inventory-item-icon inventory-rope-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M23 10c-2-4-8-6-12-3s-5 9-2 13 9 5 13 2 4-8 1-10-7-1-8 2 1 5 4 4"/><path d="m9 23-3 4m17-4 4 3"/></svg></span>
            <span><strong>Corde</strong><small>Une corde tressée</small></span>
            <span class="inventory-lock" aria-hidden="true">·</span>
          </button>
        </div>
        <p class="inventory-hint">Choisis l’objet demandé par le berger.</p>
      </section>

      <!-- INFORMATIONS XR -->
      <p id="xr-status" class="xr-status" role="status" hidden></p>

      <output id="position-readout" class="position-readout" aria-live="polite" hidden></output>

      <div id="reveal-flash" class="reveal-flash" aria-hidden="true"></div>

      <section id="narrative-prompt" class="narrative-prompt" aria-live="polite" hidden>
        <span class="narrative-kicker">ALDILÀ · LE BERGER</span>
        <p id="narrative-text"></p>
        <button id="narrative-action" type="button"></button>
      </section>

      <aside id="collectible-card" class="collectible-card" aria-live="polite" hidden>
        <img src="./assets/images/Carte_Berger.jpg" alt="Carte à collectionner : L’ultimu Stregone" />
        <div>
          <span class="narrative-kicker">CARTE À COLLECTIONNER</span>
          <strong>L’ultimu Stregone</strong>
          <button id="collectible-claim" class="collectible-claim" type="button">Ajouter à ma collection</button>
        </div>
        <button id="collectible-close" type="button" aria-label="Fermer la carte">×</button>
      </aside>

      <!-- MESSAGE DE DÉTECTION DU MARQUEUR -->
      <div id="marker-overlay" class="marker-overlay">
        Scannez la carte <strong>Carte_Berger.jpg</strong>
      </div>

    </div>

    <script type="module" src="./js/main.js?v=shepherd-walk-on-reveal-20261117"></script>
    <script type="module" src="./js/home.js?v=code-structure-20261116"></script>

  </body>
</html>
