<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Marble Starter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    canvas {
      touch-action: none;
    }

    #mobile-movement {
      position: fixed;
      z-index: 10;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(20px, env(safe-area-inset-bottom));
      display: none;
      width: 120px;
      height: 120px;
      touch-action: none;
      user-select: none;
    }

    #movement-joystick {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(12, 20, 24, 0.38);
      touch-action: none;
    }

    #movement-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: rgba(125, 207, 190, 0.85);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #vr-button {
      position: fixed;
      z-index: 10;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 6px;
      background: rgba(12, 20, 24, 0.75);
      color: white;
      font: 600 15px sans-serif;
      touch-action: manipulation;
    }

    #vr-button[hidden], #xr-status[hidden] {
      display: none;
    }

    #xr-status {
      position: fixed;
      z-index: 10;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(72px, calc(env(safe-area-inset-bottom) + 72px));
      max-width: 240px;
      margin: 0;
      color: white;
      font: 14px sans-serif;
      text-align: right;
      text-shadow: 0 1px 3px black;
    }

    @media (max-width: 760px) {
      #mobile-movement {
        display: block;
      }
    }
  </style>
</head>

<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.180.0/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm",
        "@sparkjsdev/spark": "./spark.module.min.js"
      }
    }
  </script>
  <div id="mobile-movement" aria-label="Déplacement">
    <button id="movement-joystick" type="button" aria-label="Joystick de déplacement">
      <span id="movement-knob"></span>
    </button>
  </div>
  <button id="vr-button" type="button" hidden>Entrer en VR</button>
  <p id="xr-status" role="status" hidden></p>
  <script src="https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js"></script>
  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { SparkRenderer, SplatMesh, SparkControls, SparkXr, textSplats, dyno, utils } from "@sparkjsdev/spark";
    import GUI from "lil-gui";

    const RENDER_TIMEOUT_MS = 5 * 1000;
    const URL_BASE = ".";
    const SPAWN_POSITION = new THREE.Vector3(0, 1.5, -3.9);
    const MOVEMENT_RADIUS = 4;
    const MOVEMENT_SPEED = 2;

    const scene = new THREE.Scene();
    // scene.background = new THREE.Color(0.75, 1.0, 1.0);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Make a local frame of reference that we can move to control
    // the camera, or as a frame of reference in WebXR mode
    const localFrame = new THREE.Group();
    scene.add(localFrame);
    localFrame.position.copy(SPAWN_POSITION);

    // Lower the splat rendering width to sqrt(5) std devs for more performance
    const spark = new SparkRenderer({
      renderer,
      maxStdDev: Math.sqrt(5),
    });
    scene.add(spark);
    localFrame.add(camera);

    const stats = new Stats();
    document.body.appendChild(stats.dom);

    const gui = new GUI({ title: "Settings" });

    const scene_json = await fetch(`${URL_BASE}/scene.json`).then((response) => response.json());
    const splats = scene_json.splats ?? [];
    const meshes = scene_json.meshes ?? [];

    // Load splats
    for (const splat of splats) {
      const splatMesh = new SplatMesh({ url: `${URL_BASE}/${splat.filename}`, lod: true });
      splatMesh.position.fromArray(splat.transform?.translation ?? [0, 0, 0]);
      splatMesh.quaternion.fromArray(splat.transform?.quaternion ?? [0, 0, 0, 1]);
      const scale = splat.transform?.scale ?? 1;
      splatMesh.scale.set(scale, scale, scale);
      scene.add(splatMesh);
    }

    // Helper to extract albedo color and texture from any material
    function extractAlbedoProperties(material) {
      let color = new THREE.Color(0x888888);
      let map = null;

      if (material.color instanceof THREE.Color) {
        color = material.color.clone();
      }
      if (material.map) {
        map = material.map;
      }

      return { color, map };
    }

    // Convert mesh materials to MeshBasicMaterial (matches Marble's behavior)
    function convertToBasicMaterials(object) {
      object.traverse((child) => {
        if (child.isMesh) {
          const originalMaterial = child.material;
          const originalMaterials = Array.isArray(originalMaterial)
            ? originalMaterial
            : [originalMaterial];

          if (originalMaterials.length === 0) {
            child.material = new THREE.MeshBasicMaterial({
              color: 0x888888,
              side: THREE.DoubleSide,
            });
          } else {
            const newMaterials = originalMaterials.map((mat) => {
              const { color, map } = extractAlbedoProperties(mat);
              return new THREE.MeshBasicMaterial({
                color: color,
                map: map,
                side: THREE.DoubleSide,
              });
            });

            child.material = newMaterials.length === 1 ? newMaterials[0] : newMaterials;
          }
        }
      });
    }

    // Load meshes (GLB/GLTF)
    const gltfLoader = new GLTFLoader();
    for (const mesh of meshes) {
      try {
        const gltf = await gltfLoader.loadAsync(`${URL_BASE}/${mesh.filename}`);
        const model = gltf.scene;
        // Convert to MeshBasicMaterial to not need lighting
        convertToBasicMaterials(model);

        model.position.fromArray(mesh.transform?.translation ?? [0, 0, 0]);
        model.quaternion.fromArray(mesh.transform?.quaternion ?? [0, 0, 0, 1]);
        const meshScale = mesh.transform?.scale ?? [1, 1, 1];
        model.scale.set(meshScale[0], meshScale[1], meshScale[2]);
        scene.add(model);
      } catch (error) {
        console.warn(`Failed to load mesh: ${mesh.filename}`, error);
      }
    }

    window.THREE = THREE;
    window.scene = scene;
    window.renderer = renderer;

    window.addEventListener("resize", onWindowResize, false);
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let renderEnabled = true;
    let lastMoved = 0;
    let lastPos = new THREE.Vector3().setScalar(Number.NEGATIVE_INFINITY);
    let lastDir = new THREE.Vector3();

    const controls = new SparkControls({
      canvas: renderer.domElement,
    });
    controls.pointerControls.reverseRotate = utils.isMobile();
    gui.add(controls.pointerControls, "reverseRotate").name("Reverse look").listen();
    controls.pointerControls.rotateSpeed *= 2.0;
    controls.pointerControls.slideSpeed *= 0.75;

    const movementJoystick = document.getElementById("movement-joystick");
    const movementKnob = document.getElementById("movement-knob");
    const movementInput = new THREE.Vector2();
    const joystickRadius = 42;
    let joystickPointerId = null;

    function updateJoystick(event) {
      const bounds = movementJoystick.getBoundingClientRect();
      const offsetX = event.clientX - (bounds.left + bounds.width / 2);
      const offsetY = event.clientY - (bounds.top + bounds.height / 2);
      const distance = Math.hypot(offsetX, offsetY);
      const strength = Math.min(distance / joystickRadius, 1);
      if (distance > 0) {
        movementInput.set(offsetX / distance * strength, offsetY / distance * strength);
      } else {
        movementInput.set(0, 0);
      }
      movementKnob.style.transform = `translate(calc(-50% + ${movementInput.x * joystickRadius}px), calc(-50% + ${movementInput.y * joystickRadius}px))`;
    }

    movementJoystick.addEventListener("pointerdown", (event) => {
      joystickPointerId = event.pointerId;
      movementJoystick.setPointerCapture(event.pointerId);
      updateJoystick(event);
    });
    movementJoystick.addEventListener("pointermove", (event) => {
      if (event.pointerId === joystickPointerId) updateJoystick(event);
    });
    function releaseJoystick(event) {
      if (event.pointerId !== joystickPointerId) return;
      joystickPointerId = null;
      movementInput.set(0, 0);
      movementKnob.style.transform = "translate(-50%, -50%)";
    }
    movementJoystick.addEventListener("pointerup", releaseJoystick);
    movementJoystick.addEventListener("pointercancel", releaseJoystick);

    function updateMovement(deltaTime) {
      if (!xr.session) {
        const yaw = new THREE.Euler().setFromQuaternion(localFrame.quaternion, "YXZ").y;
        const movement = new THREE.Vector3(movementInput.x, 0, -movementInput.y);
        movement.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
        localFrame.position.addScaledVector(movement, deltaTime / 1000 * MOVEMENT_SPEED);

        const offsetX = localFrame.position.x - SPAWN_POSITION.x;
        const offsetZ = localFrame.position.z - SPAWN_POSITION.z;
        const distance = Math.hypot(offsetX, offsetZ);
        if (distance > MOVEMENT_RADIUS) {
          const scale = MOVEMENT_RADIUS / distance;
          localFrame.position.x = SPAWN_POSITION.x + offsetX * scale;
          localFrame.position.z = SPAWN_POSITION.z + offsetZ * scale;
        }
        localFrame.position.y = SPAWN_POSITION.y;
      }
    }

    const xrButton = document.getElementById("vr-button");
    const xrStatus = document.getElementById("xr-status");

    const xr = new SparkXr({
      renderer,
      mode: "vr",
      allowMobileXr: true,
      element: xrButton,
      onMouseLeaveOpacity: 0.5,
      onReady: (supported) => {
        console.log(`SparkXr initialized: XR ${supported ? "supported" : "not supported"}`);
        xrButton.hidden = !supported;
        xrStatus.hidden = supported;
        if (!supported) xrStatus.textContent = "VR indisponible : navigateur XR et casque compatibles requis";
      },
      onEnterXr: () => {
        xrButton.textContent = "Quitter la VR";
        console.log("Enter XR");
      },
      onExitXr: () => {
        xrButton.textContent = "Entrer en VR";
        console.log("Exit XR");
      },
      // enableHands: true,
      controllers: {
        // moveHeading: true,
      },
    });

    // localFrame.add(xr.makeJointSplats(SparkXr.Hand.left));
    // localFrame.add(xr.makeJointSplats(SparkXr.Hand.right));

    let lastTime = 0;
    let rotation = 0;
    let xrTime = 0;

    // gui.add({ disableRender: () => {
    //   renderEnabled = false;
    //   console.log("Render disabled");
    // } }, "disableRender").name("Disable render");

    gui.add(spark, "lodSplatScale", 0.001, 3.0, 0.001);

    document.addEventListener("keydown", (event) => {
      if (event.key === "\\") {
        const cameraPos = camera.getWorldPosition(new THREE.Vector3());
        const cameraQuat = camera.getWorldQuaternion(new THREE.Quaternion());
        console.log("camera position: ", JSON.stringify(cameraPos.toArray()), "quaternion: ", JSON.stringify(cameraQuat.toArray()));
      }
    });

    renderer.setAnimationLoop(function animate(time, xrFrame) {
      stats.begin();

      const deltaTime = time - (lastTime || time);
      lastTime = time;

      xr.updateControllers(camera);
      controls.update(localFrame, camera);
      updateMovement(deltaTime);

      const now = performance.now();
      const dir = localFrame.getWorldDirection(new THREE.Vector3());
      if ((localFrame.position.distanceTo(lastPos) > 0.0001) || (dir.dot(lastDir) < 0.9999)) {
        lastMoved = now;
        if (!renderEnabled) {
          console.log("Render enabled");
        }
        renderEnabled = true;
        lastPos.copy(localFrame.position);
        lastDir.copy(dir);
      }
      if ((now - lastMoved) > RENDER_TIMEOUT_MS) {
        if (renderEnabled) {
          console.log("Render disabled");
        }
        renderEnabled = false;
      }

      if (renderEnabled) {
        renderer.render(scene, camera);
      }

      stats.end();
    });
  </script>
</body>

</html>
